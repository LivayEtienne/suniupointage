<app-reussi></app-reussi>
<p class="vigile-title">Vigile</p>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">


<div class="controle-moteur">
  
    <p *ngIf="!connectionStatus" class="error">
      Connexion au serveur WebSocket perdue.
      <button class="btn-reconnect" (click)="reconnecter()">Reconnexion</button>
    </p>
  
    <div *ngIf="connectionStatus" class="buttons-container">
      <button class="btn-control btn-open" (click)="ouvrir()">Ouvrir</button>
      <button class="btn-control btn-close" (click)="fermer()">Fermer</button>
    </div>
  
    <p>{{ statusMessage }}</p>
  </div>
  
  <!-- Affichage du message reçu -->
 <!-- Modal -->
<!-- Modal -->
<div *ngIf="showModal" class="modal-overlay">
  <div class="modal-content" [ngClass]="{'success': messageType === 'success', 'warning': messageType === 'warning', 'error': messageType === 'error'}">
    <p>{{ message }}</p>
    <button class="btn-close-modal" (click)="closeModal()">Fermer</button>
  </div>
</div>


  
  

<div class="container">
    <!-- Image de l'utilisateur -->
    <div class="profile-image">
      <img src="profile.png" alt="Image de l'utilisateur" class="user-image">
    </div>
  
    <!-- Informations utilisateur -->
    <div class="info-card">
      <h3><i class="fas fa-info-circle"></i> Informations</h3>
      <div class="info-details">
        <p><strong>Nom :</strong> Ababacar</p>
        <p><strong>Email :</strong></p>
      </div>
      <!-- Boutons -->
      <div class="button-group">
        <button class="btn btn-green" (click)="onCheckStatus(userId, 'checkIn')">
          <i class="fas fa-user-check"></i>
        </button>
        <button class="btn btn-red" (click)="onCheckStatus(userId, 'checkOut')">
          <i class="fas fa-user-slash"></i>
        </button>
        
      </div>
    </div>
  </div>
  
  <h3><em class="fas fa-table"></em> Tableau des Étudiants</h3>
<table class="students-table">
  <thead>
    <tr>
      <th>Role</th>
      <th>NOM</th>
      <th>uid</th>
    </tr>
  </thead>
  <tbody>
