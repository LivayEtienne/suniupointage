<!-- Container principal -->
<div class="apprenant-container">
  <!-- Utilisation du SidebarComponent -->
  <app-sidebar></app-sidebar>

  <!-- Contenu du ApprenantComponent -->
  <div class="main-content">
    <!-- Utilisation du DashboardComponent -->
    <app-dashboard></app-dashboard>

    <!-- Button to trigger the modal -->
    <button class="btn btn-success" (click)="openModal()">Ajouter Utilisateur</button><br><br>
    <h5 class="modal-title">{{ isEditMode ? 'Modifier Apprenant' : 'Ajouter Apprenant' }}</h5>

    <!-- Modal Structure -->
    <div class="modal" tabindex="-1" [ngClass]="{'show': isModalOpen}" style="display: block;" *ngIf="isModalOpen">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Formulaire d'inscription</h5>
            <button type="button" class="close" (click)="closeModal()" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <!-- Message d'erreur -->
            <div *ngIf="errorMessage" class="alert alert-danger text-center">
              {{ errorMessage }}
            </div>

            <form (ngSubmit)="onSubmit()">
              <div class="form-group">
                <label for="nom">Nom :</label>
                <input type="text" id="nom" class="form-control" [(ngModel)]="nom" name="nom" required />
              </div>
              <div class="form-group">
                <label for="prenom">Prénom :</label>
                <input type="text" id="prenom" class="form-control" [(ngModel)]="prenom" name="prenom" required />
              </div>
              <div class="form-group">
                <label for="email">Email :</label>
                <input type="email" id="email" class="form-control" [(ngModel)]="email" name="email" required />
              </div>
              <div class="form-group">
                <label for="adresse">Adresse :</label>
                <input type="text" id="adresse" class="form-control" [(ngModel)]="adresse" name="adresse" />
              </div>
              <div class="form-group">
                <label for="telephone">Téléphone :</label>
                <input type="text" id="telephone" class="form-control" [(ngModel)]="telephone" name="telephone" required />
              </div>
              <div class="form-group">
                <label for="password">Mot de passe :</label>
                <input type="password" id="password" class="form-control" [(ngModel)]="password" name="password" required />
              </div>
              <!-- Champ caché pour définir le rôle sur "apprenant" -->
              <input type="hidden" [(ngModel)]="role" name="role" value="apprenant" />

              <button type="submit" class="btn btn-primary">Inscrire</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <button class="upload-button">Uploader un fichier CSV</button>

    <table class="table table-responsive">
      <thead>
        <tr>
          <th><input type="checkbox" id="select-all"></th>
          <th>Nom Prénom</th>
          <th>Cohorte</th>
          <th>Action</th>
          <th>Statut</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let apprenant of apprenants">
          <td><input type="checkbox" class="select-item"></td>
          <td>{{ apprenant.user?.nom }} {{ apprenant.user?.prenom }}</td>
          <td>{{ apprenant.cohorte?.nom }}</td>
          <td>
            <i class="fas fa-edit" (click)="openEditModal(apprenant)"></i>
            <i class="fas fa-trash-alt" (click)="deleteApprenant(apprenant.id)"></i>
          </td>
          <td>
            <button class="btn btn-danger">Bloquer</button>
            <button class="btn btn-success">Activer</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

    <!-- Pagination -->
    <div class="pagination">
      <button (click)="setPage(currentPage - 1)" [disabled]="currentPage === 1">Précédent</button>
      <span>Page {{ currentPage }} / {{ totalPages }}</span>
      <button (click)="setPage(currentPage + 1)" [disabled]="currentPage === totalPages">Suivant</button>
    </div>
