<div class="auth-container">
    <div class="image-section">
      <img src="imagesunupointage.jpg" alt="Illustration" class="auth-image">
    </div>
    <div class="login-section">
      <form [formGroup]="authForm" (ngSubmit)="onSubmit()">  
        <h2>Connectez-vous</h2>
        <p class="para">Connectez-vous pour accéder à votre espace</p>
  
        <!-- Email Field -->
        <div class="form-group">
          <label for="email" class="espace">Email</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="Entrez votre email"
            [ngClass]="{'is-invalid': isFieldInvalid('email')}"
          />
          <div *ngIf="isFieldInvalid('email')" class="error-message">
            <p>{{ getEmailErrorMessage() }}</p>
            <p *ngIf="getEmailSuggestion()">{{ getEmailSuggestion() }}</p>
          </div>
        </div>
  
        <!-- Password Field -->
        <div class="form-group">
          <label for="password" class="espace">Mot de passe</label>
          <input
            type="password"
            id="password"
            formControlName="password"
            placeholder="Entrez votre mot de passe"
            [ngClass]="{'is-invalid': isFieldInvalid('password')}"
          />
          <div *ngIf="isFieldInvalid('password')" class="error-message">
            <p>{{ getPasswordErrorMessage() }}</p>
            <p *ngIf="getPasswordSuggestion()">{{ getPasswordSuggestion() }}</p>
          </div>
        </div>
  
        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>
        
  
        <!-- Authentication success message -->
  
        <button type="submit" [disabled]="authForm.invalid">Connexion</button>
      </form>
    </div>
  </div>
  <!-- Modal d'erreur -->
<div *ngIf="errorMessage" class="modal-overlay" (click)="closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h3>Erreur</h3>
      <button (click)="closeModal()" class="close-button">&times;</button>
    </div>
    <div class="modal-body">
      <p>{{ errorMessage }}</p>
    </div>
    <div class="modal-footer">
      <button (click)="closeModal()">Fermer</button>
    </div>
  </div>
</div>
